<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Prompt Inspector (VIDU)</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e293b; border-radius: 12px; padding: 32px; width: 100%; max-width: 550px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .subtitle { font-size: 14px; color: #94a3b8; text-align: center; margin-bottom: 24px; }
        textarea { width: 100%; height: 80px; background-color: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #f8fafc; padding: 12px; font-size: 14px; resize: none; outline: none; transition: border 0.2s; margin-bottom: 16px; }
        textarea:focus { border-color: #38bdf8; }
        button { width: 100%; background-color: #38bdf8; color: #0f172a; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background-color 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        button:hover { background-color: #0ea5e9; }
        button:disabled { background-color: #475569; color: #94a3b8; cursor: not-allowed; }
        .result-box { display: none; margin-top: 24px; background-color: #0f172a; border: 1px solid #38bdf8; border-radius: 8px; padding: 16px; position: relative; }
        .result-title { font-size: 12px; color: #38bdf8; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
        .result-text { font-size: 14px; color: #f8fafc; line-height: 1.5; white-space: pre-wrap; font-family: monospace; }
        .error { border-color: #ef4444; color: #fca5a5; }
    </style>
</head>
<body>

<div class="container">
    <h1>Anime Prompt Inspector 🔍</h1>
    <div class="subtitle">Gerador de prompts profissionais para IA de vídeo (Vidu)</div>
    
    <textarea id="ideaInput" placeholder="Digite sua ideia de cena anime (ex: um guerreiro desembainhando a espada na chuva estilo MAPPA)"></textarea>
    <button id="generateBtn" onclick="generatePrompt()">Gerar Prompt para Vidu</button>

    <div id="resultContainer" class="result-box">
        <div class="result-title">Prompt Otimizado (Copie para o Vidu):</div>
        <div id="resultText" class="result-text"></div>
    </div>
</div>

<script>
    async function generatePrompt() {
        const input = document.getElementById('ideaInput');
        const button = document.getElementById('generateBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultText = document.getElementById('resultText');
        
        if (!input.value.trim()) return;

        button.disabled = true;
        button.innerText = 'Direcionando cena...';
        resultContainer.style.display = 'none';
        resultContainer.classList.remove('error');

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idea: input.value })
            });

            const data = await response.json();

            if (response.ok) {
                resultText.innerText = data.prompt;
                resultContainer.style.display = 'block';
            } else {
                throw new Error(data.error || 'Erro ao gerar prompt');
            }
        } catch (err) {
            resultText.innerText = err.message;
            resultContainer.classList.add('error');
            resultContainer.style.display = 'block';
        } finally {
            button.disabled = false;
            button.innerText = 'Gerar Prompt para Vidu';
        }
    }
</script>

</body>
</html>

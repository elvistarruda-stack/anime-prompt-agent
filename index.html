<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Prompt Inspector (VIDU)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e293b; border-radius: 12px; padding: 32px; width: 100%; max-width: 600px; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 24px; text-align: center; margin-bottom: 24px; }
        textarea { width: 100%; height: 120px; background-color: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #f8fafc; padding: 14px; font-size: 16px; margin-bottom: 20px; resize: none; outline: none; }
        textarea:focus { border-color: #38bdf8; }
        button { width: 100%; background-color: #38bdf8; color: #0f172a; border: none; border-radius: 8px; padding: 16px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:hover { background-color: #0ea5e9; }
        button:disabled { background-color: #475569; color: #94a3b8; cursor: not-allowed; }
        .result-box { display: none; margin-top: 24px; background-color: #0f172a; border: 1px solid #38bdf8; border-radius: 8px; padding: 16px; }
        .result-title { font-size: 12px; color: #38bdf8; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        .result-text { font-size: 14px; line-height: 1.5; font-family: monospace; white-space: pre-wrap; }
    </style>
    <script>
        async function generatePrompt() {
            const input = document.getElementById('ideaInput');
            const button = document.getElementById('generateBtn');
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');
            
            if (!input.value.trim()) return;

            button.disabled = true;
            button.innerText = 'Gerando...';
            resultContainer.style.display = 'none';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        idea: input.value,
                        imageMode: '2-img',
                        camera: 'tracking shot',
                        pace: '4s-fast'
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    resultText.innerText = data.prompt;
                    resultContainer.style.display = 'block';
                } else {
                    throw new Error(data.error || 'Erro ao gerar');
                }
            } catch (err) {
                resultText.innerText = err.message;
                resultContainer.style.display = 'block';
            } finally {
                button.disabled = false;
                button.innerText = 'Gerar Prompt Otimizado';
            }
        }
    </script>
</head>
<body>

<div class="container">
    <h1>Anime Prompt Inspector 🔍</h1>
    
    <textarea id="ideaInput" placeholder="Digite sua ideia de cena anime aqui..."></textarea>
    <button id="generateBtn" onclick="generatePrompt()">Gerar Prompt Otimizado</button>

    <div id="resultContainer" class="result-box">
        <div class="result-title">Prompt Final Sakuga (Vidu):</div>
        <div id="resultText" class="result-text"></div>
    </div>
</div>

</body>
</html>

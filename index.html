<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Prompt Inspector (VIDU)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #090d16; color: #f8fafc; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }
        .container { background-color: #111827; border-radius: 12px; padding: 24px; width: 100%; max-width: 600px; border: 1px solid #1f2937; margin-top: 20px; }
        h1 { color: #38bdf8; font-size: 24px; text-align: center; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 24px; }
        textarea { width: 100%; height: 100px; background-color: #090d16; border: 1px solid #374151; border-radius: 8px; color: #f8fafc; padding: 14px; font-size: 15px; margin-bottom: 16px; resize: none; outline: none; }
        textarea:focus { border-color: #38bdf8; }
        button { width: 100%; background-color: #38bdf8; color: #090d16; border: none; border-radius: 8px; padding: 16px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:hover { background-color: #0ea5e9; }
        button:disabled { background-color: #374151; color: #64748b; cursor: not-allowed; }
        .result-box { display: none; margin-top: 24px; background-color: #090d16; border: 1px solid #38bdf8; border-radius: 8px; padding: 16px; }
        .result-title { font-size: 12px; color: #38bdf8; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        .result-text { font-size: 14px; line-height: 1.5; font-family: monospace; white-space: pre-wrap; color: #f8fafc; }
    </style>
    <script>
        async function generatePrompt() {
            const input = document.getElementById('ideaInput');
            const button = document.getElementById('generateBtn');
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');
            
            if (!input.value.trim()) return;

            button.disabled = true;
            button.innerText = 'Orquestrando Cena...';
            resultContainer.style.display = 'none';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idea: input.value })
                });

                const data = await response.json();

                if (response.ok) {
                    resultText.innerText = data.prompt;
                    resultContainer.style.display = 'block';
                } else {
                    throw new Error(data.error || 'Erro ao processar');
                }
            } catch (err) {
                resultText.innerText = err.message;
                resultContainer.style.display = 'block';
            } finally {
                button.disabled = false;
                button.innerText = 'Gerar Prompt Otimizado';
            }
        }
    </script>
</head>
<body>

<div class="container">
    <h1>Anime Prompt Inspector 🔍</h1>
    <div class="subtitle">Agente Especialista em IA de Vídeo (Estilo Vidu)</div>
    
    <textarea id="ideaInput" placeholder="Digite sua ideia aqui (Ex: o personagem vem em direção ao espectador usando 2 imagens)..."></textarea>
    <button id="generateBtn" onclick="generatePrompt()">Gerar Prompt Otimizado</button>

    <div id="resultContainer" class="result-box">
        <div class="result-title">Prompt Direto para o Vidu:</div>
        <div id="resultText" class="result-text"></div>
    </div>
</div>

</body>
</html>
